# Shared development API. No database or paid resources are provisioned here.
services:
  - type: web
    name: auto-fit-api-dev
    runtime: python
    plan: free
    region: singapore
    branch: backend
    autoDeployTrigger: "off"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_ALLOWED_HOSTS
        value: auto-fit-api-dev.onrender.com,localhost,127.0.0.1
      - key: MAX_REQUEST_BODY_BYTES
        value: "12582912"
      - key: API_DOCS_ENABLED
        value: "true"
      - key: ENABLE_TEST_ENDPOINTS
        value: "false"
