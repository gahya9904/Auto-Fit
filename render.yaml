# Shared development API. No database or paid resources are provisioned here.
services:
  - type: web
    name: auto-fit-api-dev
    runtime: python
    plan: free
    region: singapore
    branch: backend
    autoDeployTrigger: "off"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_ALLOWED_HOSTS
        value: auto-fit-api-dev.onrender.com,localhost,127.0.0.1
      - key: MAX_REQUEST_BODY_BYTES
        value: "12582912"
      - key: API_DOCS_ENABLED
        value: "true"
      - key: ENABLE_TEST_ENDPOINTS
        value: "false"
      - key: HEALTH_DOCUMENT_OCR_URL
        value: https://211-233-193-159.sslip.io/ai/ocr
      - key: HEALTH_DOCUMENT_OCR_TOKEN
        sync: false
      - key: HEALTH_DOCUMENT_OCR_MOCK_ENABLED
        value: "false"

  # Render cron schedules are UTC; 15:00 UTC is 00:00 Asia/Seoul.
  - type: cron
    name: auto-fit-diet-refresh-kst
    runtime: python
    region: singapore
    branch: backend
    schedule: "0 15 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.diet_refresh
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: FRONTEND_ORIGIN
        value: https://cron.internal
      - key: SUPABASE_URL
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_PUBLISHABLE_KEY
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: CHAT_AI_ENABLED
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: CHAT_AI_ENABLED
      - key: CHAT_AI_URL
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: CHAT_AI_URL
      - key: CHAT_AI_API_KEY
        fromService:
          name: auto-fit-api-dev
          type: web
          envVarKey: CHAT_AI_API_KEY
